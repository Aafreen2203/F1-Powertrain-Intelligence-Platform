name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Tests and quality checks (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install documented development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .

      - name: Compile application and tests
        run: python -m compileall -q app.py src pages tests

      - name: Check installed dependency consistency
        run: python -m pip check
